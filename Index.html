<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FirstResponder AI: Universal Emergency Guide</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ef4444">
  <style>
    :root {
      --bg: #0f172a; --card-bg: #1e293b; --danger: #ef4444; --accent: #38bdf8;
      --text: #f8fafc; --text-muted: #94a3b8; --border: #334155; --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 1rem; min-height: 100vh; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 650px; }

    header { text-align: center; margin-bottom: 1rem; }
    header h1 { font-size: 1.5rem; color: var(--danger); }
    header p { color: var(--text-muted); font-size: 0.85rem; }

    .action-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .call-btn { flex: 2; background: var(--danger); color: white; padding: 0.8rem; border-radius: 8px; font-weight: bold; text-decoration: none; text-align: center; }
    .er-btn { flex: 1; background: #0284c7; color: white; padding: 0.8rem; border-radius: 8px; font-weight: bold; text-decoration: none; text-align: center; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 0.5rem; margin-bottom: 1rem; }
    .nav-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 0.6rem; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }
    .nav-btn.active { border-color: var(--accent); color: var(--accent); background: #334155; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; text-align: center; margin-bottom: 1rem; }
    .step-badge { background: var(--accent); color: #000; font-weight: bold; padding: 0.2rem 0.5rem; border-radius: 10px; font-size: 0.75rem; }
    .step-title { font-size: 1.2rem; margin: 0.5rem 0; }
    .step-desc { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 1rem; }

    /* Quiz Styling */
    .quiz-option { display: block; width: 100%; background: #0f172a; border: 1px solid var(--border); color: white; padding: 0.75rem; margin: 0.5rem 0; border-radius: 6px; cursor: pointer; text-align: left; }
    .quiz-option.correct { border-color: var(--success); background: rgba(16, 185, 129, 0.2); }
    .quiz-option.wrong { border-color: var(--danger); background: rgba(239, 68, 68, 0.2); }

    /* Support / Monetization Bar */
    .monetize-bar { background: #1e293b; border: 1px dashed var(--accent); padding: 0.75rem; border-radius: 8px; text-align: center; font-size: 0.85rem; }
    .pay-btn { background: var(--success); color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; font-weight: bold; cursor: pointer; margin-left: 0.5rem; }
  </style>
</head>
<body>

  <div class="app">
    <header>
      <h1>🚨 FirstResponder AI</h1>
      <p>Offline Voice Guide & Emergency Assistant</p>
    </header>

    <div class="action-row">
      <a href="tel:911" class="call-btn">📞 CALL 911</a>
      <a href="#" onclick="findNearestER()" class="er-btn">🏥 Find Nearest ER</a>
    </div>

    <div class="grid">
      <button class="nav-btn active" onclick="loadModule('cuts')">🩸 Cut</button>
      <button class="nav-btn" onclick="loadModule('fracture')">🦴 Fracture</button>
      <button class="nav-btn" onclick="loadModule('cpr')">🫀 CPR</button>
      <button class="nav-btn" onclick="loadModule('quiz')">🧠 Quiz</button>
    </div>

    <div class="card" id="mainCard">
      <span class="step-badge" id="stepBadge">Step 1</span>
      <h2 class="step-title" id="stepTitle">Loading...</h2>
      <p class="step-desc" id="stepDesc">...</p>
      <div id="quizContainer"></div>
    </div>

    <div class="monetize-bar">
      <span>💙 Support this emergency app development</span>
      <button class="pay-btn" onclick="donate()">Donate $5</button>
    </div>
  </div>

  <script>
    const modules = {
      cuts: [
        { title: "Direct Pressure", desc: "Apply heavy pressure over wound with clean cloth." },
        { title: "Elevate Limb", desc: "Raise injury above heart if no broken bone is present." }
      ],
      fracture: [
        { title: "Immobilize Area", desc: "Do NOT attempt to align bone. Keep completely still." },
        { title: "Apply Cold Compress", desc: "Wrap ice in cloth and apply to site. Never apply direct ice." }
      ],
      cpr: [
        { title: "Check Pulse & Breath", desc: "Tap shoulders, call out. Check chest for movement." },
        { title: "Push Hard & Fast", desc: "Compress chest center 2 inches deep at 110 BPM." }
      ]
    };

    let currentMod = 'cuts';
    let stepIdx = 0;

    function loadModule(mod) {
      currentMod = mod; stepIdx = 0;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      if (mod === 'quiz') renderQuiz(); else renderStep();
    }

    function renderStep() {
      const data = modules[currentMod][stepIdx];
      document.getElementById('quizContainer').innerHTML = '';
      document.getElementById('stepBadge').innerText = `Step ${stepIdx + 1}`;
      document.getElementById('stepTitle').innerText = data.title;
      document.getElementById('stepDesc').innerText = data.desc;
      speak(`${data.title}. ${data.desc}`);
    }

    function renderQuiz() {
      document.getElementById('stepBadge').innerText = "Training Quiz";
      document.getElementById('stepTitle').innerText = "CPR Compression Rate";
      document.getElementById('stepDesc').innerText = "What is the recommended compression pace for adult CPR?";
      
      const opts = [
        { text: "60 - 80 BPM", correct: false },
        { text: "100 - 120 BPM", correct: true },
        { text: "140 - 160 BPM", correct: false }
      ];

      let html = '';
      opts.forEach((o, i) => {
        html += `<button class="quiz-option" onclick="checkQuiz(${o.correct}, this)">${o.text}</button>`;
      });
      document.getElementById('quizContainer').innerHTML = html;
    }

    function checkQuiz(isCorrect, btn) {
      if (isCorrect) { btn.classList.add('correct'); speak("Correct. 100 to 120 beats per minute."); }
      else { btn.classList.add('wrong'); speak("Incorrect. Target speed is 100 to 120 beats per minute."); }
    }

    function speak(txt) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(txt));
      }
    }

    function findNearestER() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          const url = `https://www.google.com/maps/search/emergency+room/@${pos.coords.latitude},${pos.coords.longitude},13z`;
          window.open(url, '_blank');
        }, () => alert("Location access denied. Search 'ER near me' manually."));
      }
    }

    function donate() {
      // Replace with your Stripe Checkout link or Buy Me a Coffee link
      window.open("https://buy.stripe.com/your_stripe_link_here", "_blank");
    }

    // Register PWA Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW failed', err));
    }

    renderStep();
  </script>
</body>
</html>
